<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Sistem Monitoring Stok - PERURI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f3c88, #4a69bd);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #ffffff;
            width: 330px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            color: #1f3c88;
        }
        p {
            text-align: center;
            font-size: 14px;
            color: #555;
        }
        label {
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1f3c88;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #162d63;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login Sistem</h2>
    <p>Monitoring Stok Bahan Penunjang<br>PERUM PERURI</p>

    <form onsubmit="return validasiLogin()">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">

        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">

        <button type="submit">Login</button>
        <div class="error" id="errorMsg">Username atau Password salah!</div>
    </form>
</div>

<script>
function validasiLogin() {
    const userBenar = "P262";
    const passBenar = "P262Peruri";

    const userInput = document.getElementById("username").value;
    const passInput = document.getElementById("password").value;

    if (userInput === userBenar && passInput === passBenar) {
        window.location.href = "dashboard.html"; // 🔑 PENGHUBUNG
        return false;
    } else {
        document.getElementById("errorMsg").style.display = "block";
        return false;
    }
}
</script>
